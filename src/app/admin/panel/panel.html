<div class="top">

    <input placeholder="Busca tu proxima canción">
    <button class="pill-btn"><app-icon name="mic" /></button>
  </div>
  <span class="clock">5:33 p. m.</span>
</div>
<div class="stage">

      <span class="status-pill abierto">● Escenario Activo</span>
      <p class="status-msg">En vivo · El gran varón - Willie Colón</p>
    </div>
  </div>
</div>
