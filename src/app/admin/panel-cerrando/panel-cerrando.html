<div class="top">
  <span class="crumb">Panel principal › <b class="state-badge cerrando">Cerrando</b></span>
  <div class="pill-input search">
    <input placeholder="Busca tu proxima canción">
    <button class="pill-btn"><app-icon name="mic" /></button>
  </div>
  <span class="clock">5:33 p. m.</span>
</div>
<div class="stage">
  <a class="btn-gold dup" routerLink="/pantalla" target="_blank">Duplicar video <app-icon name="share" [size]="16" /></a>
  <div class="video video-cerrando">
    <div class="stage-overlay">
      <span class="status-pill cerrando">● Estado: Cerrando</span>
      <p class="status-msg">Últimas canciones en cola · La cocina y barra cerrarán pronto</p>
    </div>
  </div>
</div>
