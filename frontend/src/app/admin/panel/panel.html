<div class="top">
  <span class="crumb">Panel principal › <b class="state-badge abierto">Abierto</b></span>
  <app-buscador />
  <span class="clock">{{ state.hora() }}</span>
</div>
<div class="stage">
  <a class="btn-gold dup" routerLink="/pantalla" target="_blank">Duplicar video <app-icon name="share" [size]="16" /></a>
  <div class="video video-abierto">
    <div class="stage-overlay">
      <span class="status-pill abierto">● Escenario Activo</span>
      <p class="status-msg">
        @if (state.sonando(); as s) {
          En vivo · {{ s.titulo }} - {{ s.artista }}
        } @else {
          Sin canción sonando · Esperando pedidos
        }
      </p>
    </div>
  </div>
</div>
