<div class="top">
  <span class="crumb">Panel principal › <b class="state-badge cerrado">Cerrado</b></span>
  <div class="pill-input search">
    <input placeholder="Busca tu proxima canción">
    <button class="pill-btn"><app-icon name="mic" /></button>
  </div>
  <span class="clock">{{ state.horaPartes().hora }}<span class="clock-colon">:</span>{{ state.horaPartes().minuto }} {{ state.horaPartes().ampm }}</span>
</div>
<div class="stage">
  <a class="btn-gold dup" routerLink="/pantalla" target="_blank">Duplicar video <app-icon name="share" [size]="16" /></a>
  <div class="video video-cerrado">
    <div class="stage-overlay">
      <span class="status-pill cerrado">● Estado: Cerrado</span>
      <p class="status-msg">Local cerrado · No se aceptan nuevos pedidos de canciones</p>
    </div>
  </div>
</div>
