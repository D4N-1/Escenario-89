<header class="head">
    @if (atras(); as ruta) {
    <nav class="nav">
        <a routerLink="/" aria-label="Inicio"><app-icon name="home" [size]="22" /></a>
        <a [routerLink]="ruta" aria-label="Volver"><app-icon name="reply" [size]="22" /></a>
    </nav>
    }
    <img src="logo.png" [alt]="state.nombreLocal()" class="logo">
    <h1 class="brand">{{ state.nombreLocal() }}</h1>
    @if (state.mesa() > 0) {
    <span class="mesa">Mesa {{ state.mesa() }}</span>
    }
</header>
