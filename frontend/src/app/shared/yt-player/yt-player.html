@let c = caja();
<div
  id="admin-player-container"
  class="caja"
  [class.mini]="!c"
  [class.con-intermission]="!!player.intermissionActual()"
  [class.oculto]="(!state.sonando() || player.karaokeIntroActivo()) && !player.intermissionActual()"
  [style.top.px]="c?.top"
  [style.left.px]="c?.left"
  [style.width.px]="c?.width"
  [style.height.px]="c?.height"
  [style.clip-path]="player.intermissionActual() ? 'none' : c?.clip"
>
  <div
    id="admin-yt-wrapper"
    class="admin-yt-wrapper"
    [class.oculto-intermission]="!!player.intermissionActual() || player.karaokeIntroActivo() || !!player.streamUrl() || player.solicitandoStream()"
  >
    <div id="admin-yt-player"></div>
  </div>

  @if (player.streamUrl(); as sUrl) {
    <video
      #adminStreamVideo
      class="stream-video"
      [src]="sUrl"
      autoplay
      playsinline
      (loadedmetadata)="player.onStreamLoadedMetadata(adminStreamVideo)"
      (timeupdate)="player.onStreamTimeUpdate(adminStreamVideo)"
      (ended)="player.onStreamEnded()"
      (error)="player.onStreamError(adminStreamVideo)"
    ></video>
  }

  @if (player.intermissionActual(); as inter) {
    <div class="intermission-overlay">
      <video
        #adminInterVideo
        class="intermission-video"
        [src]="inter.url"
        autoplay
        playsinline
        (ended)="player.onIntermissionVideoEnded()"
        (timeupdate)="player.onIntermissionTimeUpdate(adminInterVideo)"
      ></video>
      <div class="intermission-hud">
        <div class="intermission-tag">
          <span class="intermission-dot"></span>
          <span>PAUSA PUBLICITARIA</span>
        </div>
        <div class="intermission-title-box">
          <b class="intermission-title">{{ inter.title }}</b>
          <small class="intermission-desc">
            {{ player.formatearTiempoIntermission() }}{{ inter.description ? ' · ' + inter.description : '' }}
          </small>
        </div>
        <button
          type="button"
          class="btn-skip-ad"
          (click)="saltarAnuncio($event)"
          title="Saltar anuncio"
        >
          <span>Saltar</span>
          <app-icon name="next" [size]="14" />
        </button>
      </div>
    </div>
  }
</div>
