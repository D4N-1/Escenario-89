<div class="pill-input" [class.disabled]="state.estado() === 'cerrado'" [class.escuchando]="escuchandoVoz()">
  <input [placeholder]="escuchandoVoz() ? 'Escuchando... habla ahora' : (state.estado() === 'cerrado' ? 'Local cerrado - Pedidos no permitidos' : (state.estado() === 'cerrando' ? 'Local cerrando - Solo cola activa' : 'Busca tu proxima canción'))"
         [disabled]="state.estado() === 'cerrado'"
         [value]="consulta()"
         (input)="onInput($event)"
         (keydown.enter)="buscar()">
  <button class="pill-btn" type="button" [disabled]="state.estado() === 'cerrado'" title="Buscar" (click)="buscar()"><app-icon name="search" /></button>
  <button class="pill-btn mic-btn" [class.escuchando]="escuchandoVoz()" type="button" [disabled]="state.estado() === 'cerrado'" [title]="escuchandoVoz() ? 'Detener búsqueda por voz' : 'Buscar por voz'" (click)="buscarPorVoz()"><app-icon name="mic" /></button>
</div>

@if (abierto()) {
  <div class="resultados">
    <div class="cab">
      <span>{{ ultima() ? 'Resultados de «' + ultima() + '»' : 'Búsqueda de canciones' }}</span>
      <button type="button" title="Cerrar" (click)="cerrar()"><app-icon name="close" [size]="16" /></button>
    </div>


    @if (cargando()) {
      <p class="msg">Buscando…</p>
    } @else if (error()) {
      <p class="msg err">{{ error() }}</p>
    } @else {
      @for (v of resultados(); track v.id) {
        <button type="button" class="fila" (click)="agregar(v)">
          <div class="mini" [class.thumb-karaoke]="!v.miniatura" [style.background]="v.miniatura ? null : v.fondo">
            @if (v.miniatura) { <img [src]="v.miniatura" [alt]="v.titulo"> }
            @else { <span class="txt">{{ v.miniaturaTitulo }}</span> }
            <i class="time">{{ v.duracion }}</i>
          </div>
          <div class="datos">
            <b>{{ v.titulo }}</b>
            <small>{{ v.canal }} · {{ v.vistas }} vistas · {{ v.antiguedad }}</small>
            @if (v.tipo === 'karaoke') { <span class="tag">Karaoke</span> }
          </div>
          <span class="add"><app-icon name="add" [size]="16" /> Agregar</span>
        </button>
      } @empty {
        <p class="msg">Sin resultados.</p>
      }
    }
  </div>
}
