<main class="screen">
  <app-client-header atras="/buscar" />

  <section class="ok" aria-live="polite">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e8c96a" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
    <h3>Añadido a la cola</h3>
    @if (state.posicionEnCola() === 0) {
      <p>Tu canción <b>suena ahora</b>.</p>
    } @else {
      <p>Tu canción está en la<br>posición <b>{{ state.posicionEnCola() }}º</b> de la lista</p>
    }
  </section>

  <app-video-card [video]="state.cancionSeleccionada()" [inactiva]="true" />

  <a class="btn-gold otra" routerLink="/">Pedir otra canción</a>
</main>
