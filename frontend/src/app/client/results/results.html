<main class="screen">
  <app-client-header atras="/" />

  <div class="buscar">
    <div class="pill-input">
      <input [value]="state.busqueda()" enterkeyhint="search" autocomplete="off">
      <button type="button" class="pill-btn" aria-label="Buscar por voz"><app-icon name="mic" /></button>
    </div>
  </div>

  <section class="lista">
    @for (v of state.resultados(); track v.id) {
      <app-video-card [video]="v" (click)="seleccion.set(v)" />
    } @empty {
      <p class="vacio">No encontramos canciones con ese nombre. Prueba con el título y el artista.</p>
    }
  </section>
</main>

@if (seleccion(); as v) {
  <app-confirm-dialog [video]="v" (cerrar)="seleccion.set(null)" />
}
