<main class="screen">
  <app-client-header atras="/" />

  <div class="buscar">
    <div class="pill-input">
      <input #q [value]="state.busqueda()" enterkeyhint="search" autocomplete="off" (keydown.enter)="buscar(q.value)">
      <button type="button" class="pill-btn" aria-label="Buscar" (click)="buscar(q.value)"><app-icon name="search" /></button>
    </div>
  </div>

  <section class="lista">
    @if (cargando()) {
      <p class="vacio">Buscando canciones…</p>
    } @else if (error()) {
      <p class="vacio">{{ error() }}</p>
    } @else {
      @for (v of resultados(); track v.id) {
        <app-video-card [video]="v" (click)="seleccion.set(v)" />
      } @empty {
        <p class="vacio">No encontramos canciones con ese nombre. Prueba con el título y el artista.</p>
      }
    }
  </section>
</main>

@if (seleccion(); as v) {
  <app-confirm-dialog [video]="v" (cerrar)="seleccion.set(null)" />
}
